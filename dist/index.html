<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#FBF6EE" />
    <meta name="description" content="闪决——一个指令，一次点击，在时间流干之前点中对的格子。" />
    <title>闪决 · SNAP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-label="闪决游戏">
      <header class="hud">
        <div class="hud-top">
          <div class="stat">
            <span class="stat-label">关卡</span>
            <strong id="level">1</strong>
          </div>
          <div id="lives" class="lives" aria-label="剩余生命"></div>
          <div class="stat stat-right">
            <button id="mute" class="mute" type="button" aria-label="开关音效" aria-pressed="false">🔊</button>
            <div class="col">
              <span class="stat-label">分数</span>
              <strong id="score">0</strong>
            </div>
          </div>
        </div>

        <div class="prompt-row">
          <span id="prompt-icon" class="prompt-icon" hidden aria-hidden="true"></span>
          <h1 id="prompt" class="prompt">准备好了吗</h1>
        </div>

        <div class="timer" aria-hidden="true"><i id="timer-fill"></i></div>
      </header>

      <section id="play-area" class="play-area">
        <div id="options" class="options" data-count="3"></div>
        <div id="combo" class="combo" hidden></div>
        <div id="popups" class="popups" aria-hidden="true"></div>
      </section>

      <section id="start-screen" class="overlay">
        <div class="brand">
          <span class="brand-badge" aria-hidden="true">⚡</span>
          <p class="eyebrow">REACTION · JUDGMENT</p>
          <h2 class="title">闪决</h2>
          <p class="sub">一个指令，一次点击<br />在时间流干之前，点中对的格子</p>
        </div>
        <button id="start" class="btn-primary" type="button"><span>开始挑战</span><i aria-hidden="true">→</i></button>
        <p class="best-line">最高记录 <strong id="best-start">0</strong></p>
      </section>

      <section id="result" class="overlay" hidden>
        <p class="eyebrow" id="result-eyebrow">信号中断</p>
        <h2 class="title">本局结束</h2>
        <div class="result-score">
          <span>得分</span>
          <strong id="final-score">0</strong>
        </div>
        <div class="result-stats">
          <div><span>最高分</span><strong id="best-result">0</strong></div>
          <div><span>最大连击</span><strong id="max-combo">0</strong></div>
          <div><span>准确率</span><strong id="accuracy">0%</strong></div>
        </div>
        <button id="restart" class="btn-primary" type="button"><span>再来一局</span><i aria-hidden="true">↻</i></button>
      </section>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
